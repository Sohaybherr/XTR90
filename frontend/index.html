<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="XTRA90" />
    <meta name="apple-mobile-web-app-title" content="XTRA90" />
    <meta name="theme-color" content="#080b10" />
    <meta name="description" content="XTRA90 live football scores, fixtures, news, and team coverage." />
    <title>XTRA90</title>
    <script>
      ;(() => {
        const supported = ['en', 'fr', 'ar', 'de', 'es']
        const firstSegment = window.location.pathname.split('/').filter(Boolean)[0]
        const storedLanguage = localStorage.getItem('language')
        const candidate = firstSegment || storedLanguage || navigator.language
        const language = supported.includes(String(candidate).slice(0, 2).toLowerCase())
          ? String(candidate).slice(0, 2).toLowerCase()
          : 'en'
        document.documentElement.lang = language
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const storedTheme = localStorage.getItem('theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = storedTheme || (prefersDark ? 'dark' : 'light')
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
